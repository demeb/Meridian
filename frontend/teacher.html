<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Meridian</title>
  <meta name="description" content="Qualifications, experience, services, pricing and live availability." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=r6" />
  <link rel="stylesheet" href="/css/base.css?v=r6" />
  <link rel="stylesheet" href="/css/components.css?v=r6" />
  <link rel="stylesheet" href="/css/pages.css?v=r6" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="teachers">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head">
      <div class="grid-backdrop" aria-hidden="true"></div>
      <div class="container-wide">
        <a class="btn-link" href="/teachers">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span data-i18n="teacher.back">All tutors</span>
        </a>
      </div>
    </section>

    <section style="padding-bottom:var(--space-9)">
      <div class="container-wide">
        <div id="profileRoot">
          <div class="card" style="height:280px"><div class="skeleton" style="height:100%"></div></div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js?v=r6"></script>
  <script src="/js/app.js?v=r6"></script>
  <script src="/js/taxonomy.js?v=r6"></script>
  <script src="/js/teacher.js?v=r6"></script>
</body>
</html>
