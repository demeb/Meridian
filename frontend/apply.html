<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Meridian</title>
  <meta name="description" content="Teach on Meridian: set your own price, choose your own hours, and meet students preparing for international programmes and universities." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="teachers">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>
  <main id="main">
    <section class="page-head">
      <div class="container">
        <span class="eyebrow" data-i18n="apply.eyebrow">Teach on Meridian</span>
        <h1 style="margin-top:1rem" data-i18n="apply.title">Your expertise, students everywhere.</h1>
        <p class="lede" data-i18n="apply.lede"></p>
        <div class="grid grid-3 apply-values" style="margin-top:2.2rem" data-reveal-group>
          <div class="card value-card" data-reveal><span class="value-icon" data-icon="wallet"></span><h3 data-i18n="apply.v1.title">Your price, in full</h3><p data-i18n="apply.v1.body"></p></div>
          <div class="card value-card" data-reveal><span class="value-icon" data-icon="calendar"></span><h3 data-i18n="apply.v2.title">Your hours</h3><p data-i18n="apply.v2.body"></p></div>
          <div class="card value-card" data-reveal><span class="value-icon" data-icon="users"></span><h3 data-i18n="apply.v3.title">Students who are ready</h3><p data-i18n="apply.v3.body"></p></div>
        </div>
      </div>
    </section>
    <section style="padding-bottom:var(--space-9)">
      <div class="container-narrow">
        <div id="applyRoot"><div class="card" style="height:260px"><div class="skeleton" style="height:100%"></div></div></div>
      </div>
    </section>
  </main>
  <div id="footer-root"></div>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/taxonomy.js"></script>
  <script src="/js/photo-crop.js"></script>
  <script src="/js/tutor-form.js"></script>
  <script src="/js/apply.js"></script>
</body>
</html>
