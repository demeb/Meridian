<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Meridian</title>
  <meta name="robots" content="noindex" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=r5" />
  <link rel="stylesheet" href="/css/base.css?v=r5" />
  <link rel="stylesheet" href="/css/components.css?v=r5" />
  <link rel="stylesheet" href="/css/pages.css?v=r5" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="admin">
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head">
      <div class="container-wide">
        <span class="eyebrow">Internal</span>
        <h1 style="margin-top:1rem;font-size:var(--step-3)">Stored data</h1>
        <p class="lede">Everything visitors have submitted, read straight out of <span class="mono">backend/meridian.db</span>.</p>
      </div>
    </section>

    <section style="padding-bottom:var(--space-9)">
      <div class="container-wide">
        <form class="card card-pad-lg" id="tokenForm" style="max-width:460px">
          <div class="field">
            <label for="adminToken">Admin token</label>
            <input class="input" id="adminToken" type="password" placeholder="meridian-admin" autocomplete="off" />
            <span class="field-hint">Set <span class="mono">MERIDIAN_ADMIN_TOKEN</span> in your .env file.</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top:1rem">Open dashboard</button>
        </form>
        <div id="adminRoot" style="margin-top:2rem"></div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js?v=r5"></script>
  <script src="/js/app.js?v=r5"></script>
  <script src="/js/admin.js?v=r5"></script>
</body>
</html>
