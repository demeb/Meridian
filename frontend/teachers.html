<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Tutors for SAT, IELTS, UWC and more · Meridian</title>
  <meta name="description" content="Find tutors and college counsellors for SAT, ACT, IELTS, TOEFL, school subjects and university admissions." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Tutors for SAT, IELTS, UWC and more · Meridian" />
  <meta property="og:description" content="Find tutors and college counsellors for SAT, ACT, IELTS, TOEFL, school subjects and university admissions." />
  <meta property="og:site_name" content="Meridian" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=r7" />
  <link rel="stylesheet" href="/css/base.css?v=r7" />
  <link rel="stylesheet" href="/css/components.css?v=r7" />
  <link rel="stylesheet" href="/css/pages.css?v=r7" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="teachers">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head">
      <div class="grid-backdrop" aria-hidden="true"></div>
      <div class="container-wide">
        <span class="eyebrow" data-i18n="teachers.eyebrow">Tutors &amp; counsellors</span>
        <h1 style="margin-top:1rem;font-size:var(--step-3)" data-i18n="teachers.title">People who have already walked the route.</h1>
        <p class="lede" data-i18n="teachers.lede"></p>
        <a class="teach-banner" href="/tutors/apply" data-reveal>
          <span class="value-icon" data-icon="userPlus"></span>
          <span class="tb-copy">
            <h2 data-i18n="teachers.join.title">Teach on Meridian</h2>
            <p data-i18n="teachers.join.body">Set your own price and hours. We bring the students.</p>
          </span>
          <span class="tb-points">
            <span data-icon-check></span>
          </span>
          <span class="btn btn-accent"><span data-i18n="teachers.join.cta">Apply to teach</span></span>
        </a>
      </div>
    </section>

    <section style="padding-bottom:var(--space-9)">
      <div class="container-wide">
        <div class="teachers-layout">
          <aside class="filter-panel" aria-label="Filters">
            <div class="searchbar">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <label class="sr-only" for="teacherSearch" data-i18n="teachers.filter.search">Search</label>
              <input id="teacherSearch" type="search" autocomplete="off"
                     data-i18n-ph="teachers.filter.search" placeholder="Search by name or subject" />
            </div>

            <div class="filter-section">
              <h4 data-i18n="teachers.filter.subject">I need help with</h4>
              <div id="subjectFilters"></div>
            </div>

            <div class="filter-section">
              <h4 data-i18n="teachers.filter.region">Target region</h4>
              <div id="regionFilters"></div>
            </div>

            <div class="filter-section">
              <h4 data-i18n="teachers.filter.price">Max price per hour</h4>
              <div class="range-row">
                <label class="sr-only" for="priceRange">Max price</label>
                <input type="range" id="priceRange" min="30" max="200" step="5" value="200" />
                <output class="range-value" id="priceValue">$200+</output>
              </div>
            </div>

            <div class="filter-section">
              <h4 data-i18n="teachers.filter.language">Language</h4>
              <div id="languageFilters"></div>
            </div>

            <button type="button" class="btn btn-ghost btn-block" id="clearFilters" data-i18n="teachers.filter.clear">Clear filters</button>
          </aside>

          <div>
            <div class="results-head">
              <strong id="resultCount" class="mono">—</strong>
              <div class="cluster">
                <label class="label" for="sortSelect" data-i18n="teachers.sort">Sort by</label>
                <select class="select" id="sortSelect" style="width:auto;min-height:40px"></select>
              </div>
            </div>
            <div class="grid grid-2" id="teacherGrid" data-reveal-group></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js?v=r7"></script>
  <script src="/js/app.js?v=r7"></script>
  <script src="/js/taxonomy.js?v=r7"></script>
  <script src="/js/teachers.js?v=r7"></script>
</body>
</html>
