<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Meridian</title>
  <meta name="description" content="The cited research behind Meridian: the education gap in Georgia and Qatar, competitors, business model and funding." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="about">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head">
      <div class="grid-backdrop" aria-hidden="true"></div>
      <div class="container">
        <span class="eyebrow" data-i18n="research.eyebrow">Our research</span>
        <h1 style="margin-top:1rem" data-i18n="research.title">What we found before we built anything.</h1>
        <p class="lede" id="researchMethod"></p>
        <nav class="subnav" id="aboutSubnav" style="margin-top:2.5rem" aria-label="About sections"></nav>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="rs-live" id="liveStats" aria-live="polite"></div>
      </div>
    </section>

    <!-- 01 Problem -->
    <section class="section-sm" id="problem">
      <div class="container">
        <div class="rs-head" data-reveal>
          <span class="rs-num">01</span>
          <div><h2 data-i18n="research.problem.title">The problem</h2>
          <p class="muted" data-i18n="research.problem.lede"></p></div>
        </div>
        <div class="fact-grid" id="researchFacts"></div>
      </div>
    </section>

    <!-- 02 Solution fit -->
    <section class="section-sm" id="solution">
      <div class="container">
        <div class="rs-head" data-reveal>
          <span class="rs-num">02</span>
          <div><h2 data-i18n="research.solution.title">How Meridian answers it</h2>
          <p class="muted" data-i18n="research.solution.lede"></p></div>
        </div>
        <div class="fit-list" id="fitList"></div>
      </div>
    </section>

    <!-- 05 Funding -->
    <section class="section-sm" id="funding">
      <div class="container">
        <div class="rs-head" data-reveal>
          <span class="rs-num">03</span>
          <div><h2 data-i18n="research.fund.title">Funding, accelerators and competitions</h2>
          <p class="muted" data-i18n="research.fund.lede"></p></div>
        </div>
        <div class="fund-list" id="fundList"></div>
      </div>
    </section>

  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/taxonomy.js"></script>
  <script src="/js/about.js"></script>
  <script src="/js/research.js"></script>
</body>
</html>
