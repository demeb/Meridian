<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Leadership · Meridian</title>
  <meta name="description" content="The co-founders behind Meridian, and the roles we are hiring for." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=r7" />
  <link rel="stylesheet" href="/css/base.css?v=r7" />
  <link rel="stylesheet" href="/css/components.css?v=r7" />
  <link rel="stylesheet" href="/css/pages.css?v=r7" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="about">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head">
      <div class="grid-backdrop" aria-hidden="true"></div>
      <div class="container">
        <span class="eyebrow" data-i18n="leadership.eyebrow">Leadership</span>
        <h1 style="margin-top:1rem" data-i18n="leadership.title">Who is behind Meridian</h1>
        <p class="lede" data-i18n="leadership.lede"></p>
        <nav class="subnav" id="aboutSubnav" style="margin-top:2.5rem" aria-label="About sections"></nav>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="grid grid-2" id="founderList" data-reveal-group></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head" data-reveal>
          <span class="eyebrow" data-i18n="footer.careers">Careers</span>
          <h2 style="margin-top:1rem" data-i18n="leadership.join.title">We are hiring</h2>
          <p class="lede" data-i18n="leadership.join.body"></p>
        </div>
        <div class="grid grid-3" id="roleList" data-reveal-group></div>
        <div class="cluster" style="margin-top:2.5rem">
          <a class="btn btn-primary btn-lg" href="/engage" data-i18n="leadership.join.cta">Write to us</a>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js?v=r7"></script>
  <script src="/js/app.js?v=r7"></script>
  <script src="/js/taxonomy.js?v=r7"></script>
  <script src="/js/about.js?v=r7"></script>
</body>
</html>
