<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Meridian</title>
  <meta name="description" content="Partnerships for schools, universities, programme operators, NGOs and companies working with students." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=r6" />
  <link rel="stylesheet" href="/css/base.css?v=r6" />
  <link rel="stylesheet" href="/css/components.css?v=r6" />
  <link rel="stylesheet" href="/css/pages.css?v=r6" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="engage">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head">
      <div class="grid-backdrop" aria-hidden="true"></div>
      <div class="container">
        <span class="eyebrow" data-i18n="engage.eyebrow">Partnerships</span>
        <h1 style="margin-top:1rem" data-i18n="engage.title">Let’s build something together.</h1>
        <p class="lede" data-i18n="engage.lede"></p>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="engage-layout">
          <form class="card card-pad-lg" id="engageForm" novalidate data-reveal="left">
            <div class="auth-row">
              <div class="field">
                <label for="company" data-i18n="engage.form.company">Organisation</label>
                <input class="input" id="company" name="company" required autocomplete="organization" />
                <span class="field-error">—</span>
              </div>
              <div class="field">
                <label for="contactName" data-i18n="engage.form.name">Your name</label>
                <input class="input" id="contactName" name="name" required autocomplete="name" />
                <span class="field-error">—</span>
              </div>
            </div>

            <div class="field" style="margin-top:1rem">
              <label for="contactEmail" data-i18n="engage.form.email">Email</label>
              <input class="input" id="contactEmail" name="email" type="email" required autocomplete="email" inputmode="email" />
              <span class="field-error">—</span>
            </div>

            <div class="field" style="margin-top:1rem">
              <label for="kind" data-i18n="engage.form.kind">What is this about?</label>
              <select class="select" id="kind" name="kind"></select>
            </div>

            <div class="field" style="margin-top:1rem">
              <label for="message" data-i18n="engage.form.message">Message</label>
              <textarea class="textarea" id="message" name="message" required
                        data-i18n-ph="engage.form.messagePlaceholder" placeholder="Tell us what you have in mind…"></textarea>
              <span class="field-error">—</span>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" id="engageSubmit" style="margin-top:1.5rem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 2.5 2 10.2l8 2.8 2.8 8z"/><path d="m10 13 4.5-4.5"/></svg>
              <span data-i18n="engage.form.submit">Send message</span>
            </button>
            <p class="field-hint" style="margin-top:.8rem;text-align:center">
              <span data-i18n="engage.direct.response">Response time</span>:
              <span data-i18n="engage.direct.responseValue">Within 2 working days</span>
            </p>
          </form>

          <aside class="stack" style="gap:var(--space-5)" data-reveal="right">
            <div class="card card-pad-lg">
              <h2 style="font-size:var(--step-1);margin-bottom:.5rem" data-i18n="engage.direct.title">Or reach us directly</h2>
              <div class="contact-line">
                <span class="contact-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3 7 9 6 9-6"/></svg></span>
                <span><b><a href="mailto:hello@meridian.ge">hello@meridian.ge</a></b><span data-i18n="engage.direct.email">Email</span></span>
              </div>
              <div class="contact-line">
                <span class="contact-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5.2l3.2 1.9"/></svg></span>
                <span><b data-i18n="engage.direct.responseValue">Within 2 working days</b><span data-i18n="engage.direct.response">Response time</span></span>
              </div>
              <div class="contact-line">
                <span class="contact-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-5.8 7-11a7 7 0 1 0-14 0c0 5.2 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
                <span><b data-i18n="engage.direct.basedValue">Doha, Qatar</b><span data-i18n="engage.direct.based">Based in</span></span>
              </div>
            </div>

            <div class="card card-pad-lg">
              <h2 style="font-size:var(--step-1);margin-bottom:1.2rem" data-i18n="engage.why.title">What partners get</h2>
              <ul class="plan-list" id="partnerBenefits"></ul>
            </div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js?v=r6"></script>
  <script src="/js/app.js?v=r6"></script>
  <script src="/js/engage.js?v=r6"></script>
</body>
</html>
