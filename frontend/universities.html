<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Meridian</title>
  <meta name="description" content="Universities worldwide: tuition, deadlines, rankings and an application checklist for each." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="universities">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head">
      <div class="grid-backdrop" aria-hidden="true"></div>
      <div class="container-wide">
        <div class="head-row" style="margin-bottom:0">
          <div style="max-width:62ch">
            <span class="eyebrow" data-i18n="uni.eyebrow">Universities</span>
            <h1 style="margin-top:1rem;font-size:var(--step-3)" data-i18n="uni.title">Every university. One application home.</h1>
            <p class="lede" data-i18n="uni.lede"></p>
          </div>
          <div class="searchbar" style="min-width:min(100%,340px)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label class="sr-only" for="uniSearch">Search</label>
            <input id="uniSearch" type="search" autocomplete="off" data-i18n-ph="uni.search" placeholder="Search universities…" />
          </div>
        </div>
      </div>
    </section>

    <section style="padding-bottom:var(--space-9)">
      <div class="container-wide">
        <nav class="section-tabs" role="tablist" aria-label="Sections">
          <a href="/programs?s=projects" class="sec-tab" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
            <span data-i18n="programs.sec.projects">Projects</span></a>
          <a href="/programs?s=scholarships" class="sec-tab" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="9" r="5.5"/><path d="m8.5 13.8-1.3 7.2L12 18.6l4.8 2.4-1.3-7.2"/></svg>
            <span data-i18n="programs.sec.scholarships">Scholarships</span></a>
          <a href="/universities" class="sec-tab is-active" aria-selected="true" role="tab">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/></svg>
            <span data-i18n="programs.sec.universities">Universities</span><span class="sec-count" id="uniTotal"></span></a>
        </nav>

        <div class="uni-map-card">
          <canvas id="uniMap" class="uni-map" aria-label="Map of universities"></canvas>
          <div class="uni-map-tip" id="uniTip" hidden></div>
          <div class="uni-map-legend" aria-hidden="true">
            <span><i class="lg lg-top"></i><span data-i18n="uni.legend.top">Top 50</span></span>
            <span><i class="lg lg-200"></i><span data-i18n="uni.legend.200">Top 200</span></span>
            <span><i class="lg lg-other"></i><span data-i18n="uni.legend.other">Other universities</span></span>
          </div>
        </div>

        <div class="uni-filters" id="uniFilters">
          <label class="ctl"><span data-i18n="uni.f.region">Region</span><select class="select" id="fRegion"></select></label>
          <label class="ctl"><span data-i18n="uni.f.country">Country</span><select class="select" id="fCountry"></select></label>
          <label class="ctl"><span data-i18n="uni.f.tier">Ranking</span><select class="select" id="fTier"></select></label>
          <label class="ctl"><span data-i18n="uni.f.tuition">Tuition per year</span><select class="select" id="fTuition"></select></label>
          <label class="ctl"><span data-i18n="uni.f.platform">Apply through</span><select class="select" id="fPlatform"></select></label>
          <label class="ctl ctl-check"><input type="checkbox" id="fAid" /><span data-i18n="uni.f.aid">Aid for international students</span></label>
          <span class="ctl-count mono" id="uniCount"></span>
          <button type="button" class="btn btn-ghost btn-sm" id="uniReset" data-i18n="programs.reset">Reset</button>
        </div>

        <div class="uni-grid" id="uniGrid"></div>

        <section class="uni-directory">
          <div class="spread" style="align-items:end;gap:1rem;flex-wrap:wrap">
            <div>
              <h2 class="op-h2" data-i18n="uni.dir.title">All other universities</h2>
              <p class="muted" data-i18n="uni.dir.lede"></p>
            </div>
            <span class="ctl-count mono" id="dirCount"></span>
          </div>
          <div class="dir-list" id="dirList"></div>
          <button type="button" class="btn btn-outline" id="dirMore" hidden data-i18n="uni.dir.more">Show more</button>
        </section>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/universities.js"></script>
</body>
</html>
