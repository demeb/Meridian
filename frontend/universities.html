<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Meridian</title>
  <meta name="description" content="Universities worldwide: tuition, deadlines, rankings and an application checklist for each." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=r6" />
  <link rel="stylesheet" href="/css/base.css?v=r6" />
  <link rel="stylesheet" href="/css/components.css?v=r6" />
  <link rel="stylesheet" href="/css/pages.css?v=r6" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="universities">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head is-compact">
      <div class="grid-backdrop" aria-hidden="true"></div>
      <div class="container-wide">
        <div class="head-row" style="margin-bottom:0">
          <div style="max-width:62ch">
            <span class="eyebrow" data-i18n="uni.eyebrow">Universities</span>
            <h1 style="margin-top:1rem;font-size:var(--step-3)" data-i18n="uni.title">Every university. One application home.</h1>
            <p class="lede" data-i18n="uni.lede"></p>
          </div>
          <div class="searchbar" style="min-width:min(100%,340px)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label class="sr-only" for="uniSearch">Search</label>
            <input id="uniSearch" type="search" autocomplete="off" data-i18n-ph="uni.search" placeholder="Search universities…" />
          </div>
        </div>
      </div>
    </section>

    <section class="uni-page">
      <div class="container-wide uni-layout">
        <aside class="uni-side" id="uniSide" aria-label="Filters">
          <div class="uni-side-head">
            <b data-i18n="uni.f.title">Filters</b>
            <button type="button" class="link-btn" id="uniReset" data-i18n="programs.reset">Reset</button>
          </div>

          <fieldset class="uf-group">
            <legend data-i18n="uni.f.scores">Your scores</legend>
            <p class="uf-hint" data-i18n="uni.f.scoresHint">Enter what you have — we show where you fit.</p>
            <div class="uf-scores">
              <label class="uf-field"><span>SAT</span><input class="input" id="fSat" type="number" inputmode="numeric" min="400" max="1600" step="10" placeholder="1450" /></label>
              <label class="uf-field"><span>ACT</span><input class="input" id="fAct" type="number" inputmode="numeric" min="1" max="36" placeholder="32" /></label>
              <label class="uf-field"><span>IELTS</span><input class="input" id="fIelts" type="number" inputmode="decimal" min="1" max="9" step="0.5" placeholder="7.0" /></label>
              <label class="uf-field"><span>TOEFL</span><input class="input" id="fToefl" type="number" inputmode="numeric" min="0" max="120" placeholder="100" /></label>
              <label class="uf-field"><span>Duolingo</span><input class="input" id="fDuo" type="number" inputmode="numeric" min="10" max="160" step="5" placeholder="120" /></label>
            </div>
            <label class="ctl-check"><input type="checkbox" id="fFitOnly" /><span data-i18n="uni.f.fitOnly">Only where my scores qualify</span></label>
            <label class="ctl-check"><input type="checkbox" id="fTestOptional" /><span data-i18n="uni.f.testOptional">SAT/ACT optional</span></label>
          </fieldset>

          <fieldset class="uf-group">
            <legend data-i18n="uni.f.where">Where</legend>
            <label class="uf-field"><span data-i18n="uni.f.major">Major</span><select class="select" id="fMajor"></select></label>
            <label class="uf-field"><span data-i18n="uni.f.region">Region</span><select class="select" id="fRegion"></select></label>
            <label class="uf-field"><span data-i18n="uni.f.country">Country</span><select class="select" id="fCountry"></select></label>
          </fieldset>

          <fieldset class="uf-group">
            <legend data-i18n="uni.f.money">Cost &amp; aid</legend>
            <label class="uf-field"><span data-i18n="uni.f.tuition">Tuition per year</span><select class="select" id="fTuition"></select></label>
            <label class="ctl-check"><input type="checkbox" id="fAid" /><span data-i18n="uni.f.aid">Aid for international students</span></label>
            <label class="ctl-check"><input type="checkbox" id="fSchol" /><span data-i18n="uni.f.schol">Has scholarships listed</span></label>
          </fieldset>

          <fieldset class="uf-group">
            <legend data-i18n="uni.f.more">More</legend>
            <label class="uf-field"><span data-i18n="uni.f.tier">Ranking</span><select class="select" id="fTier"></select></label>
            <label class="uf-field"><span data-i18n="uni.f.admit">Acceptance rate</span><select class="select" id="fAdmit"></select></label>
            <label class="uf-field"><span data-i18n="uni.f.type">Type</span><select class="select" id="fType"></select></label>
            <label class="uf-field"><span data-i18n="uni.f.platform">Apply through</span><select class="select" id="fPlatform"></select></label>
            <label class="ctl-check"><input type="checkbox" id="fFull" /><span data-i18n="uni.f.full">Full profiles only</span></label>
          </fieldset>
        </aside>

        <div class="uni-main">
          <div class="uni-toolbar">
            <button type="button" class="btn btn-outline btn-sm uni-filter-toggle" id="uniFilterToggle" aria-controls="uniSide" aria-expanded="false">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
              <span data-i18n="uni.f.title">Filters</span></button>
            <span class="uni-count" id="uniCount"></span>
            <div class="uni-tools">
              <label class="ctl ctl-inline"><span data-i18n="uni.sort">Sort</span><select class="select" id="fSort"></select></label>
              <div class="seg" role="group" aria-label="View">
                <button type="button" data-view="list" aria-pressed="true" data-i18n="uni.view.list">List</button>
                <button type="button" data-view="map" aria-pressed="false" data-i18n="uni.view.map">Map</button>
              </div>
            </div>
          </div>

          <div class="uni-map-card" id="uniMapCard" hidden>
            <canvas id="uniMap" class="uni-map" aria-label="Map of universities"></canvas>
            <div class="uni-map-tip" id="uniTip" hidden></div>
            <div class="uni-map-legend" aria-hidden="true">
              <span><i class="lg lg-top"></i><span data-i18n="uni.legend.top">Top 50</span></span>
              <span><i class="lg lg-200"></i><span data-i18n="uni.legend.200">Top 200</span></span>
              <span><i class="lg lg-other"></i><span data-i18n="uni.legend.other">Other universities</span></span>
            </div>
          </div>

          <div class="uni-list" id="uniGrid" aria-live="polite"></div>
          <div class="uni-more"><button type="button" class="btn btn-outline" id="uniMore" hidden data-i18n="uni.dir.more">Show more</button></div>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js?v=r6"></script>
  <script src="/js/app.js?v=r6"></script>
  <script src="/js/universities.js?v=r6"></script>
</body>
</html>
