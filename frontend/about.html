<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <title>Meridian</title>
  <meta name="description" content="Meridian brings programmes, tutors and college counselling for students in Georgia into one place." />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061229" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/brand/favicon-64.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png?v=3" />
  <meta name="apple-mobile-web-app-title" content="Meridian" />
  <meta property="og:title" content="Meridian" />
  <meta property="og:image" content="/assets/brand/meridian-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;1,400&family=Noto+Sans+Georgian:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap" />
  <link rel="stylesheet" href="/css/tokens.css?v=r5" />
  <link rel="stylesheet" href="/css/base.css?v=r5" />
  <link rel="stylesheet" href="/css/components.css?v=r5" />
  <link rel="stylesheet" href="/css/pages.css?v=r5" />
  <script>
    /* Set theme + language before first paint so nothing flashes. */
    (function () {
      try {
        var theme = localStorage.getItem('meridian.theme');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var lang = localStorage.getItem('meridian.lang') || 'en';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    })();
  </script>
</head>
<body data-page="about">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="nav-root"></div>

  <main id="main">
    <section class="page-head">
      <div class="grid-backdrop" aria-hidden="true"></div>
      <div class="container">
        <span class="eyebrow" data-i18n="about.eyebrow">About Meridian</span>
        <h1 style="margin-top:1rem" data-i18n="about.title">We are closing the information gap.</h1>
        <p class="lede" data-i18n="about.lede"></p>
        <nav class="subnav" id="aboutSubnav" style="margin-top:2.5rem" aria-label="About sections"></nav>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="grid grid-2" data-reveal-group>
          <article class="card card-pad-lg" data-reveal="left">
            <span class="value-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5.2-5.2 2 2-5.2z"/></svg>
            </span>
            <h2 style="font-size:var(--step-2);margin:1.2rem 0 .8rem" data-i18n="about.mission.title">Our mission</h2>
            <p class="muted" data-i18n="about.mission.body"></p>
          </article>
          <article class="card card-pad-lg" data-reveal="right">
            <span class="value-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 16 5.5-5.5 3.5 3.5L21 5"/><path d="M15.5 5H21v5.5"/></svg>
            </span>
            <h2 style="font-size:var(--step-2);margin:1.2rem 0 .8rem" data-i18n="about.vision.title">Where this goes</h2>
            <p class="muted" data-i18n="about.vision.body"></p>
          </article>
        </div>
      </div>
    </section>

    <section class="section-sm">
      <div class="container">
        <div class="card card-pad-lg">
          <h2 class="eyebrow" style="margin-bottom:1.8rem" data-i18n="about.numbers.title">Meridian today</h2>
          <div class="grid grid-4" id="aboutStats">
            <div><div class="stat-value"><span data-live="programs">—</span></div><div class="stat-label" data-i18n="research.live.programs">Programmes in the database</div></div>
            <div><div class="stat-value"><span data-live="countries">—</span></div><div class="stat-label" data-i18n="research.live.countries">Host countries</div></div>
            <div><div class="stat-value"><span data-live="verified">—</span></div><div class="stat-label" data-i18n="research.live.verified">Checked against official pages</div></div>
            <div><div class="stat-value"><span data-live="families">—</span></div><div class="stat-label" data-i18n="about.stat.families">Programme categories</div></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div id="pillarList"></div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="/js/i18n.js?v=r5"></script>
  <script src="/js/app.js?v=r5"></script>
  <script src="/js/taxonomy.js?v=r5"></script>
  <script src="/js/about.js?v=r5"></script>
</body>
</html>
