# Render Blueprint — deploys Meridian as one web service with a persistent disk.
# In Render: New → Blueprint → pick this repo. Secrets are generated by Render.
services:
  - type: web
    name: meridian
    runtime: python
    plan: starter            # $7/month; the free plan cannot keep a disk
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    # One worker: SQLite and the hourly housekeeping live in a single process.
    startCommand: gunicorn run:application --workers 1 --threads 8 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    disk:
      name: meridian-data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - meridiangoal.com
      - www.meridiangoal.com
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MERIDIAN_STORAGE
        value: /var/data
      - key: MERIDIAN_DEBUG
        value: "false"
      - key: MERIDIAN_COOKIE_SECURE
        value: "true"
      - key: MERIDIAN_PUBLIC_URL
        value: https://meridiangoal.com
      - key: MERIDIAN_SECRET_KEY
        generateValue: true
      - key: MERIDIAN_ADMIN_TOKEN
        generateValue: true
      # Email: sign-up and password-reset codes go out through Gmail.
      # In Render → Environment, fill MERIDIAN_SMTP_USER (the Gmail address) and
      # MERIDIAN_SMTP_PASSWORD (a Google "app password", not the normal password).
      - key: MERIDIAN_SMTP_HOST
        value: smtp.gmail.com
      - key: MERIDIAN_SMTP_PORT
        value: "587"
      - key: MERIDIAN_MAIL_FROM
        value: Meridian <no-reply@meridiangoal.com>
      - key: MERIDIAN_SMTP_USER
        sync: false
      - key: MERIDIAN_SMTP_PASSWORD
        sync: false
      # Meridian AI: paste the Anthropic API key in Render → Environment.
      - key: ANTHROPIC_API_KEY
        sync: false
